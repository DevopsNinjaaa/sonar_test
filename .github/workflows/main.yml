name: Staging Sites Build and Push
on:
  push

jobs:
  build:
    strategy:
      matrix:
        site:
          - id: 1
            name: site1
          - id: 2
            name: site2
          - id: 3
            name: site3
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Generate output for site
        id: generate-output
        run: |
          # Simulate generating an output (e.g., image tag)
          OUTPUT="output-for-${{ matrix.site.name }}"
          echo "Generated output: $OUTPUT"
          echo "output=$OUTPUT" >> $GITHUB_OUTPUT

    outputs:
      site_output: ${{ steps.generate-output.outputs.output }}

  deploy:
    needs: build
    strategy:
      matrix:
        site:
          - id: 1
            name: site1
          - id: 2
            name: site2
          - id: 3
            name: site3
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
      - name: Use output from build job
        run: |
          echo "Using output for ${{ matrix.site.name }}: ${{ needs.build.outputs['site_output-${{ matrix.site.id }}'] }}"
      - run: ${{ tojson(needs) }}
        shell: cat {0}