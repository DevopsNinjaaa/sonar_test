name: Staging Sites 1-1 to 1-4
on:
  push

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        site:
          - id: 1
            server_name: stg1_data
            environment: staging1
            app: "staging_zdasd_1"
          - id: 2
            server_name: stg2_data
            environment: staging2
            app: "staging_zdasd_2"
          - id: 3
            server_name: stg3_data
            environment: staging3
            app: "staging_zdasd_3"
          - id: 4
            server_name: stg4_data
            environment: staging4
            app: "staging_zdasd_4"
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Echo values
        run: |
          echo "SERVER_NAME: ${{ matrix.site.server_name }}"
          echo "ENVIRONMENT: ${{ matrix.site.environment }}"
          echo "APP: ${{ matrix.site.app }}"
          echo "AWS_SECRET_ID: $AWS_SECRET_ID" >> data.txt
      
      - name: Check value
        run: cat data.txt
